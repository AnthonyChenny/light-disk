name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Check repository and corresponding source
        run: python3 scripts/check-repository.py
      - name: Build and run policy checks (no disk mounting)
        run: |
          swift build -c release --scratch-path .build/swift
          .build/swift/release/QingPanPolicyTests
