name: Bug report / 问题反馈
description: Report installation, mounting or UI problems / 安装、挂载或界面问题
body:
  - type: markdown
    attributes:
      value: "不要上传密码、Token、磁盘序列号、文件内容或完整磁盘镜像。Do not upload secrets, file contents or disk images. See SECURITY.md for security issues."
  - type: input
    id: version
    attributes:
      label: light-disk version / 版本
      placeholder: 0.1.3-beta.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and chip / 系统与芯片
      placeholder: macOS 27.0.1, M4 Pro
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: macFUSE version, disk format and connection / 组件、格式和连接方式
      placeholder: macFUSE 5.5.0, NTFS, USB-C hub
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected and actual result / 复现、预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized message / 脱敏错误信息
      description: Copy only the relevant message; remove personal paths and serial numbers.
